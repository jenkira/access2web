apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: access2web }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.ingressFromNamespaceLabels | nindent 14 }}
      ports: [{ port: 8000 }]
  egress:
    - to:
        - podSelector:
            matchLabels: {{- toYaml .Values.database.podLabels | nindent 14 }}
      ports: [{ port: {{ .Values.database.port }} }]
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
