name: Compose Stack

# Starts the stack from docker-compose.yml, which is what the Codespace uses, and runs the same end-to-end check as the image
# workflow through the nginx frontend. It also checks that the PostgreSQL for the backend tests starts. Nothing is pushed.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - ".devcontainer/**"
      - "backend/**"
      - "web/**"
      - ".github/scripts/stack_smoke.py"
      - ".github/workflows/compose-stack.yml"
  workflow_dispatch: {}

concurrency:
  group: compose-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the Compose file
        run: docker compose --profile test config -q

      # The development sign-in is on only so that the check can publish an application through the proxy.
      - name: Start the stack
        run: A2W_DEV_AUTH=1 docker compose up -d --build --wait

      - name: Check the stack through the frontend
        run: STACK_DEV_AUTH=1 python3 .github/scripts/stack_smoke.py http://localhost:8080

      # A browser cannot add the identity headers, so the frontend can add them for it. Check that the setting is honoured and that
      # the client cannot override it: a person with no role stays without it, even if the request claims a role.
      - name: Check the development identity for a browser
        run: |
          set -euo pipefail
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          expect() { if [ "$2" != "$3" ]; then echo "::error::$1: expected $3, got $2"; exit 1; fi; echo "ok   $1"; }
          expect "no identity is refused" "$(status http://localhost:8080/api/audit)" 401
          A2W_DEV_AUTH=1 A2W_DEV_USER=olive docker compose up -d --wait frontend
          expect "a configured person without a role is refused, whatever the client claims" \
            "$(status -H 'x-a2w-roles: auditor' http://localhost:8080/api/audit)" 403
          A2W_DEV_AUTH=1 A2W_DEV_USER=olive A2W_DEV_ROLES=auditor docker compose up -d --wait frontend
          expect "a configured person with a role is allowed, with no headers from the client" \
            "$(status http://localhost:8080/api/audit)" 200

      - name: Start the PostgreSQL for the backend tests
        run: docker compose --profile test up -d --wait test-db

      - name: Show the container logs if a step failed
        if: failure()
        run: docker compose --profile test logs --tail 60

      - name: Stop the stack
        if: always()
        run: docker compose --profile test down -v
