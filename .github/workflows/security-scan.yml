name: Security Scan

# Dependency audits, a filesystem and configuration scan, and a secret scan. These run on every pull request, and on a
# weekly schedule so that a newly disclosed vulnerability in a dependency that has not changed is still found. They do not
# run again on a push to main, because main advances only through a scanned pull request. The image scan is part of
# docker-image.yml.

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Resolve the backend's dependencies into a clean environment, then audit exactly what was installed. The backend
      # declares ranges, so the audit covers the versions that a fresh install picks today, transitive packages included.
      - name: Resolve the installed dependencies
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install ./backend
          /tmp/venv/bin/pip freeze --exclude-editable | grep -vi '^access2web' > /tmp/requirements.txt
          cat /tmp/requirements.txt
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          # --strict also fails when a package cannot be audited.
          pip-audit -r /tmp/requirements.txt --strict --desc

  npm-deps:
    name: npm dependency audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [web, spikes/spike5-form-editor, spikes/spike3-sandbox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: npm audit
        working-directory: ${{ matrix.dir }}
        # A fresh install, so the audit sees the lock file as it is committed.
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  filesystem-scan:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Scans the Dockerfile and the Helm chart for misconfiguration as well as the dependencies and the source for
      # vulnerabilities and secrets. It reports to the run and to code scanning, and does not fail the run.
      - name: Trivy scan (vulnerabilities, misconfiguration, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload SARIF to code scanning (best effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Upload results as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-results
          path: trivy-results.sarif
          retention-days: 30

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action needs this to find the pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
